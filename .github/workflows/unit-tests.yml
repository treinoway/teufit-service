name: Unit tests

on:
  push:
    branches:
      - master
  pull_request:
    branches: [ master, staging ]


jobs:
  test:

    env:
      DISABLE_EMAIL: 'true' 
    
    name: Run unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit
