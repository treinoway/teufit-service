name: E2E tests

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest

    env:
      DISABLE_EMAIL: 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Guard against exercise_categories index/constraint drift
        run: ci/check-exercise-category-drift.sh origin/master

      - name: Run e2e tests with Docker Postgres
        run: npm run test:e2e
