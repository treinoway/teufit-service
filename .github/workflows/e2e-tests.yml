name: E2E tests

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  e2e:
    name: e2e (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest

    # Each shard is its own runner with its own Postgres container; inside a
    # shard, files also run in parallel (one database per Vitest worker). Two
    # workers match the 2 vCPUs of a private-repo runner: more oversubscribes
    # the CPU and pushes Prisma interactive transactions past their 5s timeout.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    env:
      DISABLE_EMAIL: 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run e2e tests with Docker Postgres
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/${{ strategy.job-total }} --maxWorkers=2
