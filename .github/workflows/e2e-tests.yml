name: E2E tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master, staging ]

jobs:
  e2e:
    runs-on: ubuntu-latest

    env:
      DISABLE_EMAIL: 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Run e2e tests with Docker Postgres
        run: npm run test:e2e
